name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # OrcaCloud wants a platform suffix in the file name (name_win_x86_64.py).
  # The plugin is pure Python, so the same file is published for each platform.
  PLUGIN_FILE: "flashforge_device_tab.py"
  PLUGIN_NAME: "flashforge_device_tab"
  PLUGIN_PLATFORMS: "win_x86_64 linux_x86_64"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          file_args=()
          for platform in $PLUGIN_PLATFORMS; do
            target="${PLUGIN_NAME}_${platform}.py"
            cp "$PLUGIN_FILE" "$target"
            file_args+=(-F "files=@$target")
          done
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -F "metadata=$metadata" \
            "${file_args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
